<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>灵犀启动中</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1117; color: #cbd5e1;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #818cf8; display: inline-block;
    animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
  .title { font-size: 22px; font-weight: 600; letter-spacing: 2px; }
  .hint { font-size: 13px; color: #64748b; }
  .err { color: #f87171; white-space: pre-wrap; max-width: 640px; text-align: left; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">灵犀</div>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="hint" id="msg">正在启动后端服务（首次约 10 秒）…</div>
    <div class="err" id="err"></div>
  </div>
  <script>
    // Rust 侧 health 就绪后 eval location.replace(http://127.0.0.1:8080)；失败时写入 #err
    window.__showBackendError = (text) => {
      document.getElementById('msg').textContent = '后端启动失败';
      document.getElementById('err').textContent = text;
    };
  </script>
</body>
</html>

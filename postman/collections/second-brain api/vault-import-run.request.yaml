$kind: http-request
name: 'vault import: run + poll + assert'
method: POST
url: '{{baseUrl}}/api/notes/vault-import'
order: 14510
description: 旧仓库迁移全链路：触发（202）→ 轮询 status 至完成 → 断言 2 篇全部落地（cleanup 后首次运行 imported=2；未 cleanup 的重跑 skipped=2）、图片至少落盘 2 张（frontmatter 相对链 + wiki 纯文件名两种形态均命中）、缺失 wiki 嵌入保留原文。完成后把 importedNoteIds 存入集合变量供 cleanup 删除。
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "path": "postman/fixtures/vault-demo" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('vault run: status 202 accepted', () => pm.response.to.have.status(202));
      const st0 = pm.response.json();
      pm.test('vault run: initial status running', () => {
        pm.expect(st0.running).to.be.true;
      });
      const poll = (retries) => {
        if (retries <= 0) {
          pm.expect.fail('vault import poll timeout');
        }
        pm.sendRequest({ url: pm.variables.replaceIn('{{baseUrl}}/api/notes/vault-import/status'), method: 'GET' }, (err, resp) => {
          pm.expect(err).to.be.null;
          const s = resp.json();
          if (s.running) {
            setTimeout(() => poll(retries - 1), 1500);
            return;
          }
          pm.test('vault run: all files settled', () => {
            pm.expect(s.imported + s.updated + s.skipped + s.failed).to.equal(2);
            pm.expect(s.failed).to.equal(0);
          });
          pm.test('vault run: images copied (md link + wiki embed resolved)', () => {
            pm.expect(s.imagesCopied).to.be.at.least(2);
          });
          pm.test('vault run: wiki missing embed kept as text', () => {
            pm.expect(s.imagesBroken).to.be.at.least(1);
          });
          pm.collectionVariables.set('vaultNoteIds', JSON.stringify(s.importedNoteIds || []));
        });
      };
      setTimeout(() => poll(20), 1500);

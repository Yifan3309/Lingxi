$kind: http-request
name: 'get note (enriched: suggested tags + summary)'
method: GET
url: '{{baseUrl}}/api/notes/{{markdownNoteId}}'
order: 9500
description: M2 异步富化验收。建笔记（order 4000）后由后台线程调用 LLM 生成标签建议与摘要；前面几个 chat 请求（7000-9000）提供了天然的等待时间，这里断言富化已落库。AI 是建议者：suggestedTags 不等于 tags，采纳由用户 PUT 决定。
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('enriched note: status 200', () => pm.response.to.have.status(200));
      const note = pm.response.json();
      pm.test('enriched note: suggestedTags ready (async LLM enrich landed)', () => {
        pm.expect(note.suggestedTags, 'suggestedTags should be filled by now').to.be.a('string').and.not.be.empty;
      });
      pm.test('enriched note: summary ready', () => {
        pm.expect(note.summary, 'summary should be filled by now').to.be.a('string').and.not.be.empty;
      });
      pm.test('enriched note: suggestions not auto-applied (AI advises, user decides)', () => {
        pm.expect(note.tags).to.equal('学习');
      });

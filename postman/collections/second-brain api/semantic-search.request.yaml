$kind: http-request
name: 'semantic search (reranked)'
method: GET
url: '{{baseUrl}}/api/notes/semantic-search?q=%E6%95%B0%E6%8D%AE%E5%BA%93%E9%80%89%E5%9E%8B%E5%92%8C%E8%BF%81%E7%A7%BB%E8%AE%A1%E5%88%92&limit=3'
order: 6500
description: 语义搜索（向量召回 + 本地重排）。查询词「数据库选型和迁移计划」，断言 top1 命中 PostgreSQL 笔记——重排方向错误的模型（如输出 hidden states 的坏导出）会在本断言暴露。全链路本地推理，不依赖 LLM 密钥。
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('semantic search: status 200', () => pm.response.to.have.status(200));
      const results = pm.response.json();
      pm.test('semantic search: returns ranked results with numeric scores', () => {
        pm.expect(results).to.be.an('array').with.lengthOf.at.least(1);
        results.forEach(r => pm.expect(r.score, 'score is number').to.be.a('number'));
      });
      pm.test('semantic search: top hit is the db note (rerank direction correct)', () => {
        pm.expect(results[0].noteId).to.equal(pm.collectionVariables.get('noteId'));
      });

$kind: http-request
method: GET
url: '{{baseUrl}}/api/admin/config'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('config: status 200', () => pm.response.to.have.status(200));
      pm.test('config: chat provider present and apiKey masked', () => {
        const chat = pm.response.json().chat;
        pm.expect(chat).to.have.property('provider');
        if (chat.apiKey !== undefined) {
          pm.expect(chat.apiKey).to.match(/^(\*\*\*|.{4}\*\*\*.*)$/);
        }
      });

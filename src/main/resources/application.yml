spring:
  application:
    name: lingxi
  servlet:
    multipart:
      max-file-size: 20MB           # 上传附件/多模态导入上限（Boot 默认 1MB，会卡住大文件）
      max-request-size: 25MB
  mvc:
    async:
      request-timeout: 180000   # SSE 长连接超时（毫秒）
  datasource:
    url: jdbc:h2:file:./data/notes;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  error:
    include-message: always   # ResponseStatusException 的中文原因透出到 /error JSON（前端 api.js 读 message 展示；Boot 3 默认 never 会只剩状态码）

# 模型接入：改 provider 字段即可整体切换（openai-compatible | ollama），无需改代码。
# openai-compatible 适配一切 OpenAI 兼容端点：智谱 GLM、DeepSeek、vLLM 等，换 base-url 即可。
# 密钥从环境变量 LLM_API_KEY 读取；也可以直接把值写进 api-key（不要提交到 git）。
app:
  rag:
    top-k: 5                          # 问答最终采用的分块数
    store-path: data/embeddings.json  # 向量库文件持久化位置
    chunk-target-chars: 300           # 分块目标长度（字符）。E5 上限 512 token，中文约 1.3 token/字，300 安全；换 BGE/qwen3 可调回 500-800
    query-prefix: 'query: '           # E5 要求查询侧加 "query: "；换 BGE/qwen3-embedding 时置空 ''
    passage-prefix: 'passage: '       # E5 要求文档侧加 "passage: "；换 BGE/qwen3-embedding 时置空 ''
    reranker-enabled: true            # 本地 cross-encoder 重排（bge-reranker-v2-m3，onnx-community int8 导出；启动时自动做相关性方向自检）
    reranker-model-path: models/reranker/onnx-communitybge-reranker-v2-m3-ONNX/model_int8.onnx
    reranker-tokenizer-path: models/reranker/onnx-communitybge-reranker-v2-m3-ONNX/tokenizer.json
    reranker-provider: http              # http = Python sidecar（reranker-service/，CUDA EP + 跨请求动态批处理；不可达自动回退本地 onnx）；onnx = 进程内本地
    reranker-url: http://127.0.0.1:8900  # sidecar 地址；/health 可查 GPU 是否激活与攒批统计
    rerank-ep: cpu                       # 进程内本地 onnx 的执行模式。JVM 内加载 CUDA provider 在本机必失败（DllMain 1114，决策 15），不再启动空试
    rerank-min-score: 0.3             # 重排相关性阈值（sigmoid 归一到 0-1，与前端百分数同尺度），低于此值不进 prompt/来源。
                                      # 社区实测：不相关通常 <0.1，相关 >0.5（详见决策文档），0.3 为折中起点；开销为零（重排后过滤）
    rerank-max-length: 384            # 重排输入截断长度（token）。bge-reranker-v2-m3 原生 8k 上下文，长分块不截断时 CPU 推理可达数秒——这是此前"首字十几秒"的主因
    rerank-threads: 0                 # ONNX 推理线程数，0 = 自动（CPU 核数）
    recall-multiplier: 4              # 重排开启时向量召回量 = top-k × 此倍数，重排后过滤+截断回 top-k

  enrich:                            # AI 富化（标签建议+摘要）：显式触发（界面按钮 / POST /api/notes/{id}/enrich），保存不再自动调用
    enabled: true                    # 总开关；false 时显式端点也返回 400
    max-content-chars: 3000

  concept:                          # 概念层抽取：保存后异步排队，失败不影响保存
    enabled: true                    # 总开关；false 时不再有新抽取，已有数据照常可读
    extract-on-save: true            # 关掉后保存不再触发，只能走 /api/admin/concepts/backfill
    max-content-chars: 12000
    theme-mode: llm                    # llm = 模型按语义分组｜folder = 用文件夹做结构证据
    theme-batch-size: 20               # 每批送给模型多少个概念
    theme-max-members: 10              # 单个主题最多几个概念（与提示词里的上限一致）

  vision:                           # 多模态导入：图片/扫描 PDF 文字提取（视觉模型）；留空继承 chat 配置
    model: glm-4v-flash

  import:                           # 多模态导入：分级解析（Tika + 视觉 LLM）
    max-bytes: 20971520             # 20MB
    min-pdf-chars: 100              # Tika 抽取低于此字符数判定为扫描版 PDF → 走视觉
    max-pdf-pages: 10               # 扫描版 PDF 逐页视觉处理的上限页数
  clip:                             # 网页剪藏：URL → Tika 抽正文 + 图片落地 → LLM 清洗重写 → 笔记(source=clip)
    connect-timeout-seconds: 5
    read-timeout-seconds: 20
    max-bytes: 5242880              # 单页抓取上限 5MB（防超大页面拖死）
    user-agent: 'Mozilla/5.0 (compatible; lingxi-clip/1.0)'
    max-images: 10                  # 单页图片落地上限（过滤 icon/logo/头像后）
    max-image-bytes: 3145728        # 单张图片上限 3MB
    rewrite-max-chars: 15000        # 正文超过此字符数跳过 LLM 重写（保留 Tika 原文 + 图片文末追加）
  chat:                             # 问答附件（@链接）：仅本轮上下文，不入库、不写向量
    max-attachments: 8              # 单次提问附件数上限
    max-total-chars: 30000          # 全部附件合计字符上限（超出截断）
    max-note-chars: 8000            # 单篇笔记附件截断
    max-file-chars: 12000           # 单个上传/本地文件截断
    max-folder-chars: 20000         # 文件夹附件合计截断
    max-folder-notes: 10            # 文件夹最多取最近更新的 N 篇
    max-folder-note-chars: 3000     # 文件夹内单篇截断
    max-file-bytes: 20971520        # 上传/本地文件大小上限 20MB
    min-pdf-chars: 100              # PDF 文本低于此值判为扫描版（首版不支持）
    allow-local-files: true         # 是否允许 @ 本地绝对路径（只读）
    local-files-require-loopback: true  # 本地文件仅放行本机请求（防局域网任意读文件）
    upload-ttl-minutes: 60          # 上传解析结果内存缓存时长
    upload-cache-size: 32           # 上传缓存条数上限（超出挤掉最旧）
  vault:                            # 旧仓库一键迁移：本机 md 文件夹 → 笔记（相对目录 = folder 路径，图片落地重写链接）
    max-files: 5000                 # 单次迁移 md 篇数上限（防误指大盘符）
    max-md-bytes: 10485760          # 单篇 md 上限 10MB
    max-image-bytes: 10485760       # 单张图片上限 10MB（与 /api/assets 一致）
    exclude-dirs: [".trash", "node_modules", "__pycache__", ".stfolder"]  # 隐藏目录一律排除，这里补充非隐藏目录
  graph:                            # 知识图谱（M3）语义边参数
    semantic-min-score: 0.95        # E5 中文短文本余弦基线偏高（不相关对 ~0.85），0.90 才切得干净；同域密集笔记可调低
    semantic-top-k: 2               # 每笔记最多保留的语义边数（防毛线球）
  ai:
    chat:
      provider: openai-compatible
      openai-compatible:
        base-url: https://open.bigmodel.cn/api/paas/v4   # 智谱；DeepSeek 换 https://api.deepseek.com/v1
        api-key: ${LLM_API_KEY_demo_glm_4_7_flash}
        chat-model: glm-4-flash
        temperature: 0.7
        timeout: 60s
      ollama:
        base-url: http://localhost:11434
        chat-model: qwen3:8b
        temperature: 0.7
        timeout: 120s
    extract:                          # 概念抽取 / 主题分组：默认关掉思考，别让它占那 512/2048 的输出预算
      # max_tokens 是生成总预算，思考与正文共用；关掉 returnThinking 只是不把思考递出来，
      # 推理照样吃预算，正文可能返回空 → 旧逻辑会当成"这篇没概念"清空旧数据。
      # 所以在请求侧关：Ollama 走原生 think(false)（代码内置），云端靠下面这组参数原样拼进请求体。
      # 只影响抽取，**对话模型不碰这些参数**（对话的思考照旧显示折叠框）。
      #
      # 2026-11 实测（mimo-v2.6-flash，同一抽取 prompt、maxTokens 512）：
      #   thinking.type=disabled  → 思考增量 58 → 0 字，正文正常返回 JSON，耗时 30s → 6s  ← 有效
      #   enable_thinking=false   → 仍思考 98 字，该端点忽略此参数                          ← 无效（但无害）
      # 所以 mimo / 智谱 GLM-4.5+ 用下面这组；千问/vLLM 才用 enable_thinking。
      #
      # 若端点不认这个字段会返回 400（抽取是后台任务，只记 WARN 不影响保存），那就改成 {}。
      disable-thinking:
        thinking:
          type: disabled
        # 千问/vLLM 换这一行：enable_thinking: false
    embedding:
      provider: onnx   # onnx = 本地模型，无需网络与密钥；最终态换 ollama
      onnx:
        model-path: models/embedding/Multilingual-E5-small/model.onnx
        tokenizer-path: models/embedding/Multilingual-E5-small/tokenizer.json
        pooling-mode: MEAN
      openai-compatible:
        base-url: https://open.bigmodel.cn/api/paas/v4
        api-key: ${LLM_API_KEY:demo}
        embedding-model: embedding-3
        timeout: 60s
      ollama:
        base-url: http://localhost:11434
        embedding-model: nomic-embed-text
        timeout: 120s

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    dev.langchain4j: INFO
